name: Droidspaces RootFS Core Build

on:
  workflow_call:
    inputs:
      build_target:
        required: true
        type: string
      custom_username:
        required: false
        type: string
        default: Gold
      desktop:
        required: true
        type: string
      desktop_autostart:
        required: true
        type: boolean
      display_backend:
        required: true
        type: string
      PulseAudio:
        required: true
        type: string
      enable_zh_tz:
        required: true
        type: boolean
      enable_mesa:
        required: true
        type: boolean
      enable_8gen2_wayland:
        required: true
        type: boolean
      nosnap:
        required: true
        type: boolean
      enable_systemd257:
        required: true
        type: boolean
      enable_srf:
        required: true
        type: boolean
      enable_binfmt:
        required: true
        type: boolean
      enable_yj:
        required: true
        type: boolean
      enable_kfgj:
        required: true
        type: boolean
      enable_zip:
        required: true
        type: boolean
      enable_docker:
        required: true
        type: boolean
      wayland_package_repository:
        required: false
        type: string
        default: Goldzxcbug/droidspaces-package

jobs:
  # --------------------------------------------------------
  # Phase 1: setup (Environment preparation and variable generation)
  # --------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.find-templates.outputs.templates }}
      desktop: ${{ steps.find-templates.outputs.desktop }}
      desktop_autostart: ${{ steps.find-templates.outputs.desktop_autostart }}
      display_backend: ${{ steps.find-templates.outputs.display_backend }}
      pulseaudio_effective: ${{ steps.find-templates.outputs.pulseaudio_effective }}
      build_id: ${{ steps.prep.outputs.build_id }}
      build_date: ${{ steps.prep.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Parse user build choices
        id: find-templates
        env:
          BUILD_TARGET_INPUT: ${{ inputs.build_target }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
          DESKTOP_AUTOSTART_INPUT: ${{ inputs.desktop_autostart }}
          DESKTOP_INPUT: ${{ inputs.desktop }}
          DISPLAY_BACKEND_INPUT: ${{ inputs.display_backend }}
          ENABLE_SYSTEMD257_INPUT: ${{ inputs.enable_systemd257 }}
          PULSEAUDIO_INPUT: ${{ inputs.PulseAudio }}
          WAYLAND_PACKAGE_REPOSITORY: ${{ inputs.wayland_package_repository }}
        run: |
          set -euo pipefail
          source scripts/lib/desktop-config.sh

          fail() {
            printf '%s\n' "$1" >&2
            exit 1
          }

          TARGET="$BUILD_TARGET_INPUT"
          DESKTOP="$(desktop_normalize "$DESKTOP_INPUT")" || {
            fail "Invalid desktop: $DESKTOP_INPUT"
          }
          if [ "$DESKTOP" = "none" ]; then
            DISPLAY_BACKEND="x11"
          else
            DISPLAY_BACKEND="$(display_backend_normalize "$DISPLAY_BACKEND_INPUT")" || {
              fail "Invalid display backend: $DISPLAY_BACKEND_INPUT"
            }
          fi
          DESKTOP_AUTOSTART="$DESKTOP_AUTOSTART_INPUT"
          PULSE_AUDIO="$PULSEAUDIO_INPUT"

          if [ "$ENABLE_SYSTEMD257_INPUT" = "true" ]; then
            case "$DESKTOP" in
              kde)
                echo "systemd 257 is enabled: standard KDE is on the verified support allowlist."
                ;;
              none)
                DISPLAY_BACKEND="x11"
                DESKTOP_AUTOSTART="false"
                ;;
              *)
                [ "$TARGET" != "all-wayland" ] || {
                  fail "systemd 257 all-wayland builds only support standard KDE."
                }
                echo "systemd 257 does not support $DESKTOP: forcing desktop=none and disabling desktop auto-start."
                DESKTOP="none"
                DISPLAY_BACKEND="x11"
                DESKTOP_AUTOSTART="false"
                ;;
            esac
          fi

          if [[ ! "$WAYLAND_PACKAGE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            fail "Wayland package repository must use the public owner/repository format."
          fi
          if [[ ! "$CUSTOM_USERNAME" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]; then
            fail "Custom username must be a 1-32 character Linux username."
          fi

          if [ "$DESKTOP" = "kde-mobile" ] || [ "$DESKTOP" = "gnome" ] || [ "$DESKTOP" = "anland-next" ] || [ "$DESKTOP" = "niri" ]; then
            DISPLAY_BACKEND="anland-wayland"
          fi
          if [ "$DESKTOP" = "none" ] && [ "$DESKTOP_AUTOSTART" = "true" ]; then
            fail "Desktop auto-start cannot be enabled when desktop is none."
          fi

          case "$TARGET" in
            all)
              TEMPLATES="$({
                for dockerfile in *.Dockerfile; do
                  candidate="${dockerfile%.Dockerfile}"
                  if desktop_backend_supported "$candidate" "$DESKTOP" "$DISPLAY_BACKEND"; then
                    printf '%s\n' "$candidate"
                  fi
                done
              } | sort | jq -R -s -c 'split("\n")[:-1]')"
              ;;
            gnome-debian-ubuntu)
              # Convenience target: the GNOME desktop on Debian 13 and Ubuntu 26 only.
              DISPLAY_BACKEND="anland-wayland"
              TEMPLATES='["Debian-13","Ubuntu-26"]'
              ;;
            all-wayland)
              [ "$DESKTOP" != "none" ] || {
                fail "all-wayland requires a desktop profile."
              }
              DISPLAY_BACKEND="anland-wayland"
              TEMPLATES="$(desktop_wayland_targets_json "$DESKTOP")"
              ;;
            *)
              target_is_known "$TARGET" || {
                fail "Unknown build target: $TARGET"
              }
              desktop_backend_supported "$TARGET" "$DESKTOP" "$DISPLAY_BACKEND" || {
                fail "Unsupported target/profile/backend: $TARGET/$DESKTOP/$DISPLAY_BACKEND"
              }
              TEMPLATES="$(jq -n -c --arg t "$TARGET" '[$t]')"
              ;;
          esac

          [ "$TEMPLATES" != "[]" ] || {
            fail "No target supports $DESKTOP/$DISPLAY_BACKEND."
          }
          if [ "$DISPLAY_BACKEND" = "anland-wayland" ]; then
            PULSE_AUDIO="none"
          fi
          echo "templates=$TEMPLATES" >> "$GITHUB_OUTPUT"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "desktop_autostart=$DESKTOP_AUTOSTART" >> "$GITHUB_OUTPUT"
          echo "display_backend=$DISPLAY_BACKEND" >> "$GITHUB_OUTPUT"
          echo "pulseaudio_effective=$PULSE_AUDIO" >> "$GITHUB_OUTPUT"
          echo "Final decided build matrix: $TEMPLATES"
          echo "Desktop profile: $DESKTOP"
          echo "Desktop auto-start: $DESKTOP_AUTOSTART"
          echo "Display backend: $DISPLAY_BACKEND"
          echo "Wayland package repository: $WAYLAND_PACKAGE_REPOSITORY"
          echo "Final PulseAudio value: $PULSE_AUDIO"

      - name: Prepare build metadata
        id: prep
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')
          BUILD_ID="v$(date +'%Y%m%d-%H%M%S')"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

  # --------------------------------------------------------
  # Phase 2: build (Build of regular Linux distribution RootFS)
  # --------------------------------------------------------
  build:
    name: ${{ format('Build {0}', matrix.template) }}
    needs: setup
    if: ${{ needs.setup.outputs.templates != '[]' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.setup.outputs.templates) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: ${{ format('Build RootFS ({0})', matrix.template) }}
        env:
          ANLAND_RELEASE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
        run: |
          chmod +x build_rootfs-native.sh
          ./build_rootfs-native.sh \
            -i "${{ matrix.template }}.Dockerfile" \
            -v "${{ needs.setup.outputs.build_id }}" \
            -K "${{ needs.setup.outputs.desktop }}" \
            -L "${{ needs.setup.outputs.desktop_autostart }}" \
            -B "${{ needs.setup.outputs.display_backend }}" \
            -P "${{ needs.setup.outputs.pulseaudio_effective }}" \
            -g "${{ inputs.enable_zh_tz }}" \
            -a "${{ inputs.enable_binfmt }}" \
            -b "${{ inputs.enable_yj }}" \
            -c "${{ inputs.enable_mesa }}" \
            -d "${{ inputs.enable_kfgj }}" \
            -e "${{ inputs.enable_zip }}" \
            -f "${{ inputs.enable_docker }}" \
            -h "${{ inputs.enable_srf }}" \
            -n "${{ inputs.nosnap }}" \
            -S "${{ inputs.enable_systemd257 }}" \
            -t "${{ inputs.enable_8gen2_wayland }}" \
            -u "$CUSTOM_USERNAME"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.template }}-${{ needs.setup.outputs.desktop }}-rootfs
          path: "*.tar.xz"
          retention-days: 1

  # --------------------------------------------------------
  # Phase 3: release (Summary and release)
  # --------------------------------------------------------
  release:
    name: Publish build results
    needs: [setup, build]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "*-rootfs"
          merge-multiple: true

      - name: Organize release files
        run: |
          mkdir -p release_assets
          mv *.tar.xz release_assets/

      - name: Prepare Release notes
        env:
          BUILD_TIME: ${{ needs.setup.outputs.build_date }}
          BUILD_TARGET: ${{ inputs.build_target }}
          BUILD_ID: ${{ needs.setup.outputs.build_id }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
          DESKTOP: ${{ needs.setup.outputs.desktop }}
          DESKTOP_AUTOSTART: ${{ needs.setup.outputs.desktop_autostart }}
          DISPLAY_BACKEND: ${{ needs.setup.outputs.display_backend }}
          WAYLAND_PACKAGE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          PULSE_AUDIO: ${{ needs.setup.outputs.pulseaudio_effective }}
          ENABLE_NOSNAP: ${{ inputs.nosnap }}
          ENABLE_SYSTEMD257: ${{ inputs.enable_systemd257 }}
          ENABLE_ZH_TZ: ${{ inputs.enable_zh_tz }}
          ENABLE_MESA: ${{ inputs.enable_mesa }}
          ENABLE_8GEN2_WAYLAND: ${{ inputs.enable_8gen2_wayland }}
          ENABLE_FCITX5: ${{ inputs.enable_srf }}
          ENABLE_BINFMT: ${{ inputs.enable_binfmt }}
          ENABLE_HARDWARE: ${{ inputs.enable_yj }}
          ENABLE_DEV_TOOLS: ${{ inputs.enable_kfgj }}
          ENABLE_COMPRESSION: ${{ inputs.enable_zip }}
          ENABLE_DOCKER: ${{ inputs.enable_docker }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Droidspaces RootFS Automated Build
          Build Time: $BUILD_TIME
          Build Target (User Specified): $BUILD_TARGET
          Build ID: $BUILD_ID

          Build Options:
          - **Custom Username**: $CUSTOM_USERNAME
          - **Desktop**: $DESKTOP
          - **Desktop auto-start**: $DESKTOP_AUTOSTART
          - **Display backend**: $DISPLAY_BACKEND
          - Wayland package repository: $WAYLAND_PACKAGE_REPOSITORY
          - PulseAudio Audio Forwarding: $PULSE_AUDIO
          - Anland audio note: Wayland mode uses the built-in Anland app audio, so PulseAudio is not needed
          - nosnap: $ENABLE_NOSNAP
          - systemd 257 old-kernel compatibility: $ENABLE_SYSTEMD257
          - Use Chinese as Primary Language: $ENABLE_ZH_TZ
          - Qualcomm Snapdragon GPU Support: $ENABLE_MESA
          - Fix Snapdragon 8 Gen 2 Wayland display corruption: $ENABLE_8GEN2_WAYLAND
          - Input Method Fcitx 5 Support: $ENABLE_FCITX5
          - Cross-architecture Support: $ENABLE_BINFMT
          - Container Hardware and Network Recognition Support: $ENABLE_HARDWARE
          - Development Tools Integration: $ENABLE_DEV_TOOLS
          - Compression Tools Integration: $ENABLE_COMPRESSION
          - Docker Integration: $ENABLE_DOCKER
          EOF

      - name: Stage draft Release and upload assets
        id: stage-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.build_id }}
          target_commitish: ${{ github.sha }}
          name: ${{ format('Droidspaces RootFS {0}', needs.setup.outputs.build_id) }}
          files: "release_assets/*"
          body_path: release-notes.md

          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish staged Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.stage-release.outputs.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$RELEASE_ID" in
            ''|*[!0-9]*)
              echo "Release action did not return a valid draft Release ID." >&2
              exit 1
              ;;
          esac
          gh api \
            --method PATCH \
            "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            --silent
