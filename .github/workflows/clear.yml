name: Clean up GitHub history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to actually run the deletion"
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES"

      keep_releases:
        description: "Number of most recent Releases to keep"
        required: true
        type: string
        default: "3"

      keep_runs:
        description: "Number of most recent Actions runs to keep"
        required: true
        type: string
        default: "10"

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Safety check
        env:
          CONFIRM: ${{ inputs.confirm }}
          KEEP_RELEASES: ${{ inputs.keep_releases }}
          KEEP_RUNS: ${{ inputs.keep_runs }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "YES" ]; then
            echo "YES was not entered; aborting."
            exit 1
          fi
          case "$KEEP_RELEASES" in
            ''|*[!0-9]*) echo "The number of Releases to keep must be a non-negative integer" >&2; exit 1 ;;
          esac
          case "$KEEP_RUNS" in
            ''|*[!0-9]*) echo "The number of Actions runs to keep must be a non-negative integer" >&2; exit 1 ;;
          esac
          if [ "${#KEEP_RELEASES}" -gt 5 ] || [ "$KEEP_RELEASES" -gt 10000 ]; then
            echo "The number of Releases to keep cannot exceed 10000" >&2
            exit 1
          fi
          if [ "${#KEEP_RUNS}" -gt 5 ] || [ "$KEEP_RUNS" -gt 10000 ]; then
            echo "The number of Actions runs to keep cannot exceed 10000" >&2
            exit 1
          fi

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Delete old Releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: ${{ github.event.inputs.keep_releases }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Fetching Releases..."

          gh api "repos/$REPO/releases?per_page=100" \
            --paginate \
            --slurp \
            > release-pages.json

          COUNT="$(jq '[.[][]] | length' release-pages.json)"

          echo "Total Releases: $COUNT"

          jq -r '[.[][]] | sort_by(.published_at // .created_at) | reverse | .[] | [(.id | tostring), .tag_name, (.draft | tostring)] | @tsv' release-pages.json \
            > releases.txt

          INDEX=0

          while IFS=$'\t' read -r ID TAG DRAFT; do
            if [ "$TAG" = "anland-kde-packages" ]; then
              echo "Keeping the legacy RootFS compatibility Release: $TAG"
              continue
            fi
            if [ "$DRAFT" = "true" ]; then
              echo "Keeping the not-yet-published Draft Release: $TAG"
              continue
            fi

            INDEX=$((INDEX + 1))
            if [ "$INDEX" -le "$KEEP_RELEASES" ]; then
              echo "Keeping Release: $TAG"
              continue
            fi
            echo "Deleting Release: $TAG"

            gh api \
              --method DELETE \
              "repos/$REPO/releases/$ID"

            echo "Deleting tag: $TAG"

            gh api \
              --method DELETE \
              "repos/$REPO/git/refs/tags/$TAG" \
              || true

          done < releases.txt

          echo "Deleting orphan tags that have no matching Release..."
          gh api "repos/$REPO/git/matching-refs/tags?per_page=100" \
            --paginate \
            --jq '.[].ref | sub("^refs/tags/"; "")' \
            | sort -u > repository-tags.txt
          gh api "repos/$REPO/releases?per_page=100" \
            --paginate \
            --jq '.[].tag_name' \
            | sort -u > release-tags.txt

          release_exists_for_tag() {
            local tag="$1"

            if ! gh api "repos/$REPO/releases?per_page=100" \
              --paginate \
              --jq '.[].tag_name' \
              > live-release-tags.txt; then
              echo "Failed to fetch the live Release list; refusing to delete tag: $tag" >&2
              return 2
            fi

            if grep -Fqx -- "$tag" live-release-tags.txt; then
              return 0
            fi
            return 1
          }

          while IFS= read -r TAG; do
            [ -n "$TAG" ] || continue
            if grep -Fqx -- "$TAG" release-tags.txt; then
              echo "Keeping tag that has a matching Release: $TAG"
              continue
            fi
            if release_exists_for_tag "$TAG"; then
              echo "Keeping tag of a just-created Release: $TAG"
              continue
            else
              STATUS=$?
              if [ "$STATUS" -ne 1 ]; then
                exit "$STATUS"
              fi
            fi
            echo "Deleting orphan tag: $TAG"
            gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG"
          done < repository-tags.txt

      - name: Delete old workflow run records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RUNS: ${{ github.event.inputs.keep_runs }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Fetching workflow runs..."

          gh api "repos/$REPO/actions/runs?per_page=100" \
            --paginate \
            --slurp \
            > run-pages.json

          jq -r '[.[].workflow_runs[]] | sort_by(.created_at) | reverse | .[] | .id' run-pages.json \
            > runs.txt

          INDEX=0

          while read -r RUN_ID; do
            INDEX=$((INDEX + 1))

            if [ "$RUN_ID" = "$GITHUB_RUN_ID" ]; then
              echo "Keeping the current Cleanup run: $RUN_ID"
              continue
            fi

            if [ "$INDEX" -le "$KEEP_RUNS" ]; then
              echo "Keeping run: $RUN_ID"
              continue
            fi

            echo "Deleting run: $RUN_ID"

            gh api \
              --method DELETE \
              "repos/$REPO/actions/runs/$RUN_ID" \
              || true

          done < runs.txt
